name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zotero-mcp-plugin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zotero-mcp-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm run test:unit

      - name: Run static checks
        run: npm run lint:check

      - name: Build production XPI
        run: npm run build

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Generate checksum
        run: |
          cd .scaffold/build
          sha256sum zotero-research-bridge.xpi > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zotero-mcp-plugin/.scaffold/build/zotero-research-bridge.xpi
            zotero-mcp-plugin/.scaffold/build/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
